<text x="160.0" y="256.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">stage k shifts by 2^k iff amt[k]=1.  1+2+4+8+16 covers every shift 0..31.</text>
<text x="160.0" y="278.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">depth = log2(32) = 5.  Same reason the CSA tree beats a ripple chain.</text>
<text x="160.0" y="300.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">COMPOSITION INVARIANT (proved, 1280 cases): staged == direct shift.</text>
