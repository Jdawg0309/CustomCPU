<text x="160.0" y="256.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">sum   = X ^ Y ^ Z              (per-bit, NO carry chain — constant delay)</text>
<text x="160.0" y="278.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">carry = maj(X,Y,Z) &lt;&lt; 1        (maj = XY + XZ + YZ)</text>
<text x="160.0" y="300.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">invariant: X+Y+Z == sum+carry (mod 2^32).   probe (1,1,1) -&gt; sum=0x1 carry=0x2</text>
