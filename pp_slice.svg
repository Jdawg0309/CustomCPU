<svg xmlns="http://www.w3.org/2000/svg" width="790" height="288" viewBox="0 0 790 288">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker></defs>
<rect width="790" height="288" fill="white"/>
<text x="395.0" y="34.0" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#222">multiplier — one row slice  (repeat x32, i = 0..31)</text>
<rect x="160" y="70.0" width="170" height="112.0" rx="10" fill="#f4f6f8" stroke="#333" stroke-width="2"/>
<text x="245.0" y="131.0" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">PP_row</text>
<rect x="460" y="80.0" width="170" height="92.0" rx="10" fill="#f4f6f8" stroke="#333" stroke-width="2"/>
<text x="545.0" y="131.0" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">shift &lt;&lt;i</text>
<line x1="65.0" y1="107.3" x2="160.0" y2="107.3" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="61.0" y="99.3" font-family="monospace" font-size="13" text-anchor="end" font-weight="bold" fill="#222">Rm</text>
<line x1="106.5" y1="113.3" x2="118.5" y2="101.3" stroke="#333" stroke-width="1.4"/><text x="112.5" y="96.3" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#c0392b">32</text>
<line x1="65.0" y1="144.7" x2="160.0" y2="144.7" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="61.0" y="136.7" font-family="monospace" font-size="13" text-anchor="end" font-weight="bold" fill="#222">Rs[i]</text>

<polyline points="330.0,126.0 395.0,126.0 395.0,126.0 460.0,126.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="389.0" y1="132.0" x2="401.0" y2="120.0" stroke="#333" stroke-width="1.4"/><text x="395.0" y="115.0" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#c0392b">32</text>
<line x1="630.0" y1="126.0" x2="725.0" y2="126.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="729.0" y="118.0" font-family="monospace" font-size="13" text-anchor="start" font-weight="bold" fill="#222">P_i</text>
<line x1="671.5" y1="132.0" x2="683.5" y2="120.0" stroke="#333" stroke-width="1.4"/><text x="677.5" y="115.0" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#c0392b">32</text>
<text x="160.0" y="210.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">row  = Rm AND sext(Rs[i])      (Rs[i] broadcast to 32 lanes)</text>
<text x="160.0" y="232.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">P_i  = row &lt;&lt; i                (shift = wire placement; low-32 truncates top i bits)</text>
<text x="160.0" y="254.0" font-family="monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#444">probe: Rm=0xD, Rs[3]=1  -&gt;  row=0x0000000D,  P_3=0x00000068</text>
</svg>
